<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>しば大行進</title>
    <style>
      html,
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0b0f1e;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        display: block;
        background: #0b0f1e;
        touch-action: none;
      }
      #insets {
        position: fixed;
        pointer-events: none;
        visibility: hidden;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="insets"></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
